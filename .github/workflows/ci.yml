name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Generate dataset
      run: uv run python 00_dataset/script/dataset.py

    - name: Run ruff check
      run: uv run ruff check --exclude .agents/skills .

    - name: Run ruff format check
      run: uv run ruff format --check --exclude .agents/skills .

    - name: Run mypy
      run: uv run mypy --exclude "\.agents/skills" .

    - name: Run pytest
      run: uv run pytest
