[project]
name = "jev-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "mypy>=2.3.1",
    "pandas>=3.0.6",
    "pandas-stubs>=3.0.5.260914",
    "protobuf>=7.36.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "scikit-learn>=1.9.1",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.14.0",
    "torch>=2.5.0",
    "transformers>=5.17.0",
    "types-setuptools>=84.0.0.20260812",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
exclude = [
    "01_lightgbm/script/train.py",
    "01_lightgbm/script/evaluate.py",
    "02_distilbert/script/train.py",
    "02_distilbert/script/evaluate.py",
]
